services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  supervisor:
    build: ./supervisor
    environment:
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:-replace-with-an-internal-secret}
      MCP_SERVERS: ${MCP_SERVERS:-"{}"}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-replace-me}
      AGENT_MODEL: ${AGENT_MODEL:-gpt-4o-mini}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: :8080
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      LLM_PROVIDERS: ${LLM_PROVIDERS:-}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      CACHE_TTL_MINUTES: ${CACHE_TTL_MINUTES:-1440}
      SUPERVISOR_URL: http://supervisor:8001
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:-replace-with-an-internal-secret}
    depends_on:
      redis:
        condition: service_healthy
      supervisor:
        condition: service_healthy

volumes:
  redis-data:
